name: verify

# 对应优化方案 §7-11「静态分析与依赖逐项门禁」/ P1-09。
#
# 两层门禁：
#   static —— 任何装了 Python 的机器都能跑，不需要 Unity（纯文本规则 + 依赖扫描）；
#   unity  —— 编译 + EditMode + PlayMode，需要一台装有 Unity 2022.3.22f1c1 并注册了
#             [self-hosted, windows, unity] 标签的 Windows 机器。
#
# 说明：GitHub 托管的 runner 没有 Unity 授权，因此 unity job 用自托管标签；
# 未注册 runner 时该 job 会一直排队，静态门禁仍然生效（本地用 Tools/verify.py 跑完整验证）。

on:
  push:
    branches: [ master, main ]
  pull_request:

jobs:
  static:
    name: 静态检查（无需 Unity）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 代码风格 / 架构规则 / 依赖使用扫描
        run: python Tools/static_checks.py

  unity:
    name: 编译 + EditMode + PlayMode
    runs-on: [ self-hosted, windows, unity ]
    steps:
      - uses: actions/checkout@v4
      - name: 编译 + 测试（失败时非 0 退出码会中断流水线）
        run: python Tools/verify.py
